      - { name: app_badge_alt, label: "App Store badge: description for screen readers", type: string }
      - { name: app_badge_eyebrow, label: "App Store badge: small text", type: string }
      - { name: app_badge_title, label: "App Store badge: large text", type: string }
  about:
    label: "About page"
    type: object
    fields:
      - { name: title, label: "Headline over the large image", type: string }
      - { name: innovation, label: "Text under the headline", type: text }
      - name: creative_statement
        label: "Bold statement under the text"
        description: "Keep the <strong> and </strong> tags: they make the text bold."
        type: text
      - { name: label, label: "Small label above the team", type: string }
      - { name: team_title, label: "Team headline", type: string }
      - { name: mission, label: "Text under the team headline (also in the footer of every page)", type: text }
      - { name: subtitle, label: "Subtitle (not shown on the site)", type: string }
  contact:
    label: "Contact page"
    type: object
    fields:
      - { name: label, label: "Small label above the headline", type: string }
      - { name: title, label: "Headline", type: string }
      - { name: subtitle, label: "Text under the headline", type: text }
      - { name: address_company, label: "Address card: company name", type: string }
      - { name: address_street, label: "Address card: street", type: string }
      - { name: address_city, label: "Address card: city", type: string }
      - { name: social_label, label: "Social networks heading (also in the footer of every page)", type: string }
      - { name: address_label, label: "Address heading (not shown on the site)", type: string }
      - { name: email_label, label: "Email heading (not shown on the site)", type: string }
  media:
    label: "Media page"
    type: object
    fields:
      - { name: label, label: "Small label above the headline", type: string }
      - { name: title, label: "Headline", type: string }
      - { name: subtitle, label: "Text under the headline", type: text }
      - { name: filter_all, label: "Filter button: all", type: string }
      - { name: filter_radio, label: "Filter button and tag: radio and podcasts", type: string }
      - { name: filter_press_release, label: "Filter button and tag: press releases", type: string }
      - { name: filter_articles, label: "Filter button and tag: articles", type: string }
      - { name: filter_videos, label: "Filter button and tag: videos", type: string }
      - { name: filter_social, label: "Filter button and tag: social mentions", type: string }
      - { name: load_more, label: "Button at the bottom: show more", type: string }
      - { name: press_article, label: "Press article (not shown on the site)", type: string }
  privacy:
    label: "Privacy page"
    type: object
    fields:
      - { name: title, label: "Small label above the headline", type: string }
      - { name: effective, label: "Date line under the headline", type: string }
  nav:
    label: "Menu at the top of every page"
    type: object
    fields:
      - { name: features, label: "Link: features", type: string }
      - { name: about, label: "Link: about us (also in the footer)", type: string }
      - { name: contact, label: "Link: contact (also in the footer)", type: string }
      - { name: media, label: "Link: media (also in the footer)", type: string }
      - { name: notify, label: "Button: contact us", type: string }
      - { name: language, label: "Language heading in the phone menu", type: string }
      - { name: home, label: "Link: home (not shown on the site)", type: string }
      - { name: download, label: "Link: download (not shown on the site)", type: string }
  footer:
    label: "Footer at the bottom of every page"
    type: object
    fields:
      - { name: links_label, label: "Links heading", type: string }
      - { name: privacy, label: "Link: privacy policy", type: string }
      - { name: rights, label: "Copyright line: \"All rights reserved\"", type: string }
      - { name: made_with, label: "\"Made with\" (not shown on the site)", type: string }
      - { name: in, label: "\"in Paris\" (not shown on the site)", type: string }
  theme:
    label: "Light and dark mode switch (read by screen readers)"
    type: object
    fields:
      - { name: label, label: "Switch name", type: string }
      - { name: light, label: "Light button", type: string }
      - { name: system, label: "System button", type: string }
      - { name: dark, label: "Dark button", type: string }
  error:
    label: "Page not found (404)"
    type: object
    fields:
      - { name: not_found, label: "Headline (also the browser tab title)", type: string }
      - { name: not_found_description, label: "Text under the headline", type: text }
      - { name: back_home, label: "Button: back to the homepage", type: string }
  instagram:
    label: "Instagram photos (contact page)"
    type: object
    fields:
      - { name: alt, label: "Photo description for screen readers", type: string }

