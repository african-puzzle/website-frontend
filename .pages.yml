  - name: site-content
    label: Site content
    type: group
    items:
      - name: team
        label: Team members
        type: collection
        path: src/content/team
        format: yaml-frontmatter
        view:
          fields: [name, order]
          primary: name
          sort: [order, name]
          default: { sort: order, order: asc }
        fields:
          - { name: name, label: Name, type: string, required: true }
          - name: role
            label: Role
            type: object
            fields:
              - { name: fr, label: French, type: string }
              - { name: en, label: English, type: string }
              - { name: pcm, label: Pidgin, type: string }
              - { name: hi, label: Hindi, type: string }
              - { name: ar, label: Arabic, type: string }
          - name: linkedin
            label: LinkedIn URL
            description: "Full LinkedIn profile URL, for example https://linkedin.com/in/username. Can stay empty."
            type: string
            pattern:
              regex: '^(https?://(www\.)?linkedin\.com/.*)?$'
              message: Must be a LinkedIn URL or empty
          - name: photo
            label: Photo
            type: image
            options: { path: public/images/team }
          - name: order
            label: Display order
            description: Lower numbers appear first on the page.
            type: number
            required: true

      - name: media-coverage
        label: Media coverage
        type: collection
        path: src/content/media
        format: yaml-frontmatter
        view:
          fields: [title, category, date]
          primary: title
          sort: [date, title]
          default: { sort: date, order: desc }
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: description, label: Description, type: text }
          - name: date
            label: Date
            type: date
            required: true
            options: { format: yyyy-MM-dd }
          - name: category
            label: Category
            type: select
            required: true
            options:
              values:
                - { value: radio, label: Radio & Podcasts }
                - { value: press-release, label: Press Release }
                - { value: articles, label: Articles }
                - { value: videos, label: Videos }
                - { value: social, label: Social Mention }
          - name: image
            label: Image
            type: image
            required: true
            options: { path: public/images/media }
          - name: link
            label: Link
            description: URL of the original article, video or media source.
            type: string
            required: true

      - name: feature-cards
        label: Feature cards (screenshots and order)
        type: collection
        path: src/content/features
        format: yaml-frontmatter
        view:
          fields: [titleKey, order]
          primary: titleKey
          sort: [order]
          default: { sort: order, order: asc }
        fields:
          - name: titleKey
            label: Title (text key)
            description: "Key of the card title in the homepage text, for example features.programmes_title."
            type: string
            required: true
          - name: descKey
            label: Description (text key)
            description: "Key of the card text in the homepage text, for example features.programmes_desc."
            type: string
            required: true
          - name: screen
            label: Screenshot (French, default)
            description: "Phone screenshot in the card (WebP). Used for fr and pcm, and for en when no English screenshot is set."
            type: image
            required: true
            options: { path: public/images/app }
          - name: screenEn
            label: Screenshot (English, optional)
            description: Leave empty to use the French screenshot.
            type: image
            options: { path: public/images/app/en }
          - name: cardBg
            label: Card background colour
            type: select
            required: true
            options:
              values:
                - { value: bg-feature-programmes, label: Programmes }
                - { value: bg-feature-contacts, label: Contacts }
                - { value: bg-feature-measurements, label: Measurements }
                - { value: bg-feature-album, label: Album }
                - { value: bg-feature-appointments, label: Appointments }
                - { value: bg-feature-collab, label: Collaborators }
          - { name: order, label: Display order, type: number, required: true }

      - name: privacy-policy
        label: Privacy policy
        type: collection
        path: src/content/privacy
        format: yaml-frontmatter
        view:
          fields: [title, locale]
          primary: title
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: effectiveDate, label: Effective date, type: string, required: true }
          - name: locale
            label: Language
            type: select
            required: true
            options:
              values:
                - { value: fr, label: French }
                - { value: en, label: English }
                - { value: pcm, label: Pidgin }
                - { value: hi, label: Hindi }
                - { value: ar, label: Arabic }
          - name: body
            label: Content
            type: rich-text
            options: { format: html }

      - name: countries
        label: Countries
        type: file
        path: src/content/countries/countries.json
        format: json
        fields:
          - name: countries
            label: Countries
            type: object
            list: true
            fields:
              - { name: id, label: ID, type: string, required: true }
              - { name: emoji, label: Emoji flag, type: string, required: true }
              - name: fr
                label: French name
                description: "The homepage highlights 8 countries by their French name. Renaming one of them removes the highlight."
                type: string
                required: true
              - { name: en, label: English name, type: string, required: true }
              - { name: pcm, label: Pidgin name, type: string, required: true }
              - { name: hi, label: Hindi name, type: string, required: true }
              - { name: ar, label: Arabic name, type: string, required: true }

      - name: site-settings
        label: Site settings
        type: file
        path: src/content/settings/site.json
        format: json
        fields:
          - name: playStoreUrl
            label: Play Store URL
            type: string
            required: true
            pattern:
              regex: '^https://play\.google\.com/store/apps/details\?id=.*$'
              message: Must be a Google Play Store URL
          - name: youtubeVideoId
            label: YouTube video ID
            description: "The 11-character ID from the YouTube URL, for example dQw4w9WgXcQ."
            type: string
            required: true
          - name: launched
            label: App launched
            description: "On: the homepage shows the Google Play badge instead of \"Contact us\"."
            type: boolean
            default: false
          - { name: instagramHandle, label: Instagram handle, type: string, required: true }
          - { name: instagramUrl, label: Instagram URL, type: string, required: true }

      - name: instagram-feed
        label: Instagram feed (contact page)
        type: file
        path: src/content/settings/instagram.json
        format: json
        list: true
        fields:
          - { name: id, label: ID, type: string, required: true }
          - name: image
            label: Image
            type: image
            required: true
            options: { path: public/images/instagram }
          - { name: link, label: Instagram link, type: string, required: true }
          - { name: order, label: Display order, type: number, required: true }

      - name: about-page-image
        label: About page image
        type: file
        path: src/content/settings/about-page.json
        format: json
        fields:
          - name: heroImage
            label: Hero image
            description: The large background image at the top of the About page.
            type: image
            required: true

      - name: contact-methods
        label: Contact methods
        type: file
        path: src/content/contact/contact.json
        format: json
        fields:
          - name: contact_methods
            label: Contact methods
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string, required: true }
              - name: icon
                label: Icon
                type: select
                required: true
                options:
                  values:
                    - { value: whatsapp, label: WhatsApp }
                    - { value: facebook, label: Facebook }
                    - { value: instagram, label: Instagram }
                    - { value: telegram, label: Telegram }
                    - { value: twitter, label: Twitter }
                    - { value: linkedin, label: LinkedIn }
                    - { value: youtube, label: YouTube }
                    - { value: email, label: Email }
                    - { value: phone, label: Phone }
                    - { value: address, label: Address }
                    - { value: website, label: Website }
              - name: value
                label: Value
                description: Phone number, handle, URL or address.
                type: text
                required: true
              - name: url
                label: Link URL
                description: "Optional clickable link (tel:, mailto: or https://)."
                type: string
              - { name: order, label: Display order, type: number, required: true }
              - { name: showInFooter, label: Show in footer, type: boolean, default: false }
              - { name: showInContact, label: Show on contact page, type: boolean, default: false }
