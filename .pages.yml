# Pages CMS config (https://pagescms.org/docs/configuration/). A save is a commit
# to the branch the editor selects: a save on main deploys production.
# Field names must equal the JSON and frontmatter keys exactly.

# merge: a save deep-merges the form into the existing file, so keys this
# config does not list stay. Never remove it: without it, one save deletes them.
settings:
  content:
    merge: true

media:
  - name: images
    label: Images
    input: public/images
    output: /images

# Translation sections. Each is used five times below (fr, en, pcm, hi, ar).
components:
  hero:
    label: "Top of the page"
    type: object
    fields:
      - { name: launch_badge, label: "Small yellow badge above the headline", type: string }
      - { name: title, label: "Headline", type: text }
      - { name: subtitle, label: "Text under the headline", type: text }
      - { name: cta_how, label: "Button: how it works", type: string }
      - { name: cta_notify, label: "Button: contact us (before launch)", type: string }
      - { name: cta_download, label: "Button: download (after launch)", type: string }
  proof:
    label: "Three points under the top of the page"
    type: object
    fields:
      - { name: audio_title, label: "Point 1: title", type: string }
      - { name: audio_body, label: "Point 1: text", type: text }
      - { name: pricing_title, label: "Point 2: title", type: string }
      - { name: pricing_body, label: "Point 2: text", type: text }
      - { name: audience_title, label: "Point 3: title", type: string }
      - { name: audience_body, label: "Point 3: text", type: text }
  audio_first:
    label: "Audio section (purple, with the sound bars)"
    type: object
    fields:
      - { name: title, label: "Headline", type: string }
      - { name: body, label: "Text under the headline", type: text }
      - { name: hint, label: "Small text at the bottom", type: string }
  features:
    label: "Features section"
    type: object
    fields:
      - { name: label, label: "Small label above the section (not shown on the site)", type: string }
      - { name: title, label: "Section headline", type: string }
      - { name: subtitle, label: "Text under the section headline", type: text }
      - { name: programmes_title, label: "Card Programmes: title", type: string }
      - { name: programmes_desc, label: "Card Programmes: text", type: text }
      - { name: contacts_title, label: "Card Contacts: title", type: string }
      - { name: contacts_desc, label: "Card Contacts: text", type: text }
      - { name: measurements_title, label: "Card Measurements: title", type: string }
      - { name: measurements_desc, label: "Card Measurements: text", type: text }
      - { name: albums_title, label: "Card Albums: title", type: string }
      - { name: albums_desc, label: "Card Albums: text", type: text }
      - { name: appointments_title, label: "Card Appointments: title", type: string }
      - { name: appointments_desc, label: "Card Appointments: text", type: text }
      - { name: collab_title, label: "Card Sharing: title", type: string }
      - { name: collab_desc, label: "Card Sharing: text", type: text }
  benefits:
    label: "Benefits: three points after the feature cards"
    type: object
    fields:
      - { name: label, label: "Small label above the section (not shown on the site)", type: string }
      - { name: title, label: "Section headline (not shown on the site)", type: string }
      - { name: efficient_title, label: "Point 1: title", type: string }
      - { name: efficient_desc, label: "Point 1: text", type: text }
      - { name: time_title, label: "Point 2: title", type: string }
      - { name: time_desc, label: "Point 2: text", type: text }
      - { name: happy_title, label: "Point 3: title", type: string }
      - { name: happy_desc, label: "Point 3: text", type: text }
  pricing:
    label: "Pricing section"
    type: object
    fields:
      - { name: title, label: "Headline", type: string }
      - { name: body, label: "Text under the headline", type: text }
  cta:
    label: "Contact box after the pricing section"
    type: object
    fields:
      - { name: title, label: "Headline (before launch)", type: string }
      - { name: subtitle, label: "Text under the headline (before launch)", type: text }
      - { name: title_live, label: "Headline (after launch)", type: string }
      - { name: subtitle_live, label: "Text under the headline (after launch)", type: text }
      - { name: button, label: "Button: contact us", type: string }
  reach:
    label: "Countries section"
    type: object
    fields:
      - { name: label, label: "Small label above the section (not shown on the site)", type: string }
      - { name: title, label: "Headline", type: string }
      - { name: subtitle, label: "Text under the headline", type: string }
      - name: more_countries
        label: "Link that opens the full country list"
        description: "Keep {count}: the site replaces it with the number of countries."
        type: string
  partners:
    label: "Partners section"
    type: object
    fields:
      - { name: label, label: "Small label above the section (not shown on the site)", type: string }
      - { name: title, label: "Headline", type: string }
      - { name: body, label: "Text under the headline", type: text }
      - { name: cta, label: "Button: let's talk", type: string }
      - { name: team_link, label: "Link: meet the team", type: string }
  download:
    label: "Download banner at the bottom of the page"
